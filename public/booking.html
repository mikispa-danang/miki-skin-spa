<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miki Spa Booking</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#faf8f7;color:#222}.wrap{max-width:560px;margin:auto;padding:24px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.08)}h1{margin:0 0 6px;font-size:28px}p{margin-top:0;color:#666}label{display:block;margin:14px 0 6px;font-weight:650}input,select,textarea,button{box-sizing:border-box;width:100%;padding:13px;border-radius:12px;border:1px solid #ddd;font-size:16px}textarea{min-height:88px}button{margin-top:18px;background:#111;color:#fff;border:0;font-weight:750}.ok{display:none;padding:20px;text-align:center}.brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#888;margin-bottom:12px}</style></head><body><div class="wrap"><div class="card" id="formCard"><div class="brand">Miki Spa</div><h1 id="title">Đặt lịch</h1><p id="sub">Điền thông tin, Miki Spa sẽ xác nhận lại lịch với bạn.</p><form id="f"><label id="lName">Tên</label><input name="name" required><label id="lPhone">Điện thoại / WhatsApp</label><input name="phone"><label id="lService">Dịch vụ</label><select name="service" required><option value="">-- Chọn --</option><option>Diode Laser Hair Removal</option><option>Facial Care</option><option>Ear Cleaning</option><option>Neck & Shoulder Massage</option><option>Relaxing Hair Wash</option><option>Exfoliation</option><option>Service Package</option></select><label id="lDate">Ngày</label><input name="date" type="date" required><label id="lTime">Giờ</label><select name="time" required><option value="">-- Chọn --</option><option>09:00–12:00</option><option>12:00–15:00</option><option>15:00–18:00</option><option>18:00–21:00</option></select><label id="lNote">Ghi chú</label><textarea name="note"></textarea><button id="submit">Gửi yêu cầu đặt lịch</button></form></div><div class="card ok" id="ok"><h1>✅</h1><h2 id="okTitle">Đã gửi yêu cầu</h2><p id="okText">Quay lại Telegram để xem xác nhận từ Miki Spa.</p></div></div><script>const p=new URLSearchParams(location.search),chat_id=p.get('chat_id')||'',lang=p.get('lang')||'vi';const tr={en:{title:'Book an appointment',sub:'Enter your details and Miki Spa will confirm your appointment.',name:'Name',phone:'Phone / WhatsApp',service:'Service',date:'Date',time:'Time',note:'Note',submit:'Send booking request',ok:'Request sent',okText:'Return to Telegram to see Miki Spa’s confirmation.'},ru:{title:'Записаться',sub:'Заполните данные, и Miki Spa подтвердит запись.',name:'Имя',phone:'Телефон / WhatsApp',service:'Услуга',date:'Дата',time:'Время',note:'Примечание',submit:'Отправить заявку',ok:'Заявка отправлена',okText:'Вернитесь в Telegram, чтобы увидеть подтверждение Miki Spa.'}};if(tr[lang]){const t=tr[lang];title.textContent=t.title;sub.textContent=t.sub;lName.textContent=t.name;lPhone.textContent=t.phone;lService.textContent=t.service;lDate.textContent=t.date;lTime.textContent=t.time;lNote.textContent=t.note;submit.textContent=t.submit;okTitle.textContent=t.ok;okText.textContent=t.okText}const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());document.querySelector('[name=date]').min=d.toISOString().slice(0,10);f.onsubmit=async e=>{e.preventDefault();submit.disabled=true;const data=Object.fromEntries(new FormData(f));data.chat_id=chat_id;data.lang=lang;try{const r=await fetch('/api/book',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw 0;formCard.style.display='none';ok.style.display='block'}catch{alert('Có lỗi khi gửi. Vui lòng thử lại.');submit.disabled=false}};</script></body></html>
